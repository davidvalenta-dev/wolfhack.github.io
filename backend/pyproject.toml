[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsecast"
version = "0.1.0"
description = "Wearable metabolic-risk research prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "xgboost>=2.1",
  "mlflow>=3.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "streamlit>=1.40",
  "plotly>=5.24",
  "databricks-sdk>=0.60",
  "databricks-sql-connector>=4.0",
  "requests>=2.32",
  "pyarrow>=17",
  "joblib>=1.4",
  "pytest>=8.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest-cov>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
