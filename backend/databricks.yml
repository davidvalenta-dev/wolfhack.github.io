bundle:
  name: pulsecast
workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
resources:
  jobs:
    pulsecast_pipeline:
      name: pulsecast-pipeline-${bundle.target}
      tasks:
        - task_key: bronze
          spark_python_task:
            python_file: src/pulsecast/databricks/bronze_job.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: src/pulsecast/databricks/silver_job.py
        - task_key: gold
          depends_on:
            - task_key: silver
          spark_python_task:
            python_file: src/pulsecast/databricks/gold_job.py
        - task_key: train
          depends_on:
            - task_key: gold
          spark_python_task:
            python_file: src/pulsecast/databricks/train_job.py
